<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practise AI judgment in a fictional banking-software workplace. Ten source-based exercises in English, French and German.">
  <meta name="theme-color" content="#f6f7f8">
  <title>ReviewGym — AI judgment at work</title>
  <link rel="stylesheet" href="styles.css?v=0.3.5">
  <link rel="stylesheet" href="repair.css?v=0.3.5">
  <link rel="stylesheet" href="editorial.css?v=0.3.5">
</head>
<body>
  <a class="skip" href="#content" data-i18n="skip">Skip to content</a>
  <header class="topbar">
    <a href="./" class="brand" aria-label="ReviewGym home"><span class="brand-mark" aria-hidden="true">rg</span>ReviewGym</a>
    <nav aria-label="Workspace">
      <button class="nav-link" id="practice-nav" data-i18n="practice">Practice</button>
      <button class="nav-link" id="guide-nav" data-i18n="guide">Field guide</button>
      <button class="nav-link" id="session" data-i18n="session">Session</button>
    </nav>
    <label class="language-switch"><span class="sr-only" data-i18n="language">Language</span><select id="language"><option value="en" lang="en">English</option><option value="fr" lang="fr">Français</option><option value="de" lang="de-CH">Deutsch (CH)</option></select></label>
  </header>
  <main id="content" tabindex="-1">
    <section id="library-view" aria-labelledby="library-title">
      <div class="library-hero">
        <div class="page-intro"><span class="meta" id="library-meta"></span><h1 id="library-title" data-i18n="libraryTitle">AI judgment at work</h1><p data-i18n="libraryIntro"></p><div class="hero-actions"><button class="primary" id="explore" data-i18n="explore">Choose a topic</button><p class="progress-label" id="progress-label"></p></div></div>
        <div class="hero-diagram" aria-hidden="true">
          <img class="orbit-core" src="practice-orbit.svg?v=0.3.5" alt="" width="600" height="600">
          <img class="orbit-halo" src="practice-orbit-detail.svg?v=0.3.5" alt="" width="600" height="600">
          <img class="review-lens" src="review-lens.svg?v=0.3.5" alt="" width="600" height="600">
        </div>
      </div>
      <div class="library-heading" data-i18n="library">All topics</div>
      <div id="topic-list" tabindex="-1"></div>
    </section>
    <section id="guide-view" aria-labelledby="guide-title" hidden>
      <div class="page-intro"><h1 id="guide-title" data-i18n="guideTitle"></h1><p data-i18n="guideIntro"></p></div>
      <div id="guide-habits"></div>
      <section class="research" aria-labelledby="research-heading"><h2 id="research-heading" data-i18n="researchTitle"></h2><p class="muted" data-i18n="researchIntro"></p><div id="research-list"></div></section>
    </section>
    <section id="workspace" tabindex="-1" hidden>
      <button class="back-link" id="back-library" data-i18n="library">All topics</button>
      <div class="case-top"><p class="meta" id="case-context"></p><h1 id="case-title"></h1><p id="case-mission"></p></div>
      <details id="review-workspace" class="review-workspace" open>
        <summary id="review-summary" data-i18n="submittedReview" hidden>Your submitted review</summary>
        <div class="workbench">
          <div class="request"><span id="request-person" class="meta"></span><p id="request-text"></p></div>
          <section class="draft-panel" aria-labelledby="draft-heading">
            <div class="panel-header"><h2 id="draft-heading" data-i18n="draftHeading">Review the draft</h2><span class="meta" data-i18n="simulated">Simulated assistant</span></div>
            <p class="muted" data-i18n="instructions"></p>
            <p class="recipient"><span data-i18n="audience">Audience</span> <strong id="recipient"></strong></p>
            <div id="draft" class="draft"></div>
            <div class="draft-toolbar"><span id="flag-count" class="meta" aria-live="polite"></span><button id="hint" class="text-button" data-i18n="hint">Need a hint?</button></div>
            <p id="hint-box" class="hint-box" hidden></p>
          </section>
          <details class="evidence-panel" id="evidence-panel">
            <summary><span data-i18n="evidenceHeading">Sources</span><span class="meta" id="source-count"></span></summary>
            <p class="muted" data-i18n="evidenceIntro"></p><div id="sources"></div><p class="meta" data-i18n="evidenceNote"></p>
          </details>
          <section class="decision" aria-labelledby="decision-heading">
            <h2 id="decision-heading" data-i18n="nextAction">What should happen next?</h2>
            <div id="actions" class="actions"></div>
            <details class="reflection"><summary data-i18n="reflection">Optional reflection</summary><div class="confidence"><label for="confidence" data-i18n="confidence"></label><input type="number" id="confidence" min="0" max="100" step="1" inputmode="numeric"></div></details>
            <div class="submit-line"><span class="meta" data-i18n="nothingSent"></span><button id="submit" class="primary" disabled data-i18n="submit">Check my decision</button></div><p id="error" class="error" role="alert"></p>
          </section>
        </div>
      </details>
      <section id="feedback" aria-labelledby="feedback-title" tabindex="-1" hidden></section>
    </section>
  </main>
  <footer><p data-i18n="privacy"></p><a href="https://github.com/NourMedjedel/reviewgym" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
  <dialog id="modal"><button id="close-modal" class="close" aria-label="Close dialog">×</button><div id="modal-body"></div></dialog>
  <script type="module" src="app.js?v=0.3.5"></script>
</body>
</html>
